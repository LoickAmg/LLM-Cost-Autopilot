[package]
name = "llm-cost-autopilot"
version = "0.1.0"
edition = "2021"
description = "Routage cout/complexite entre LLM local (Ollama/LM Studio) et API payante, avec budget et disjoncteur adaptatif."
license = "MIT"

[lib]
name = "cost_autopilot"
path = "src/lib.rs"

[[bin]]
name = "autopilot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
